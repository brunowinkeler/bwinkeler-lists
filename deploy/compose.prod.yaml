name: bw-lists

# Production stack for the lists application. Contains only components whose
# lifecycle belongs to this app. The shared Caddy, PostgreSQL, and networks are
# owned by the infrastructure repository. No host ports are published.

services:
  web:
    image: ghcr.io/brunowinkeler/lists-web:${APP_VERSION:?APP_VERSION required}
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - lists-web
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ghcr.io/brunowinkeler/lists-api:${APP_VERSION:?APP_VERSION required}
    restart: unless-stopped
    env_file:
      - path: /etc/bwinkeler/apps/lists/runtime.env
        required: false
    networks:
      edge:
        aliases:
          - lists-api
      data: {}
      private: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    image: ghcr.io/brunowinkeler/lists-api:${APP_VERSION:?APP_VERSION required}
    command: ['node', 'dist/db/migrate.js']
    env_file:
      - path: /etc/bwinkeler/apps/lists/migration.env
        required: false
    profiles: ['tools']
    networks:
      data: {}

networks:
  edge:
    external: true
    name: bw-edge
  data:
    external: true
    name: bw-data
  private:
    name: bw-lists-private
    internal: true
