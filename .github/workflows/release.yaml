name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute and validate version
        id: version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=lists-api
          cache-to: type=gha,mode=max,scope=lists-api
          tags: |
            ghcr.io/brunowinkeler/lists-api:${{ steps.version.outputs.version }}
            ghcr.io/brunowinkeler/lists-api:git-${{ github.sha }}

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=lists-web
          cache-to: type=gha,mode=max,scope=lists-web
          tags: |
            ghcr.io/brunowinkeler/lists-web:${{ steps.version.outputs.version }}
            ghcr.io/brunowinkeler/lists-web:git-${{ github.sha }}

      - name: Record release
        run: |
          {
            echo "### Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "| Image | Version tag | Digest |"
            echo "| ----- | ----------- | ------ |"
            echo "| lists-api | ${{ steps.version.outputs.version }} | ${{ steps.api.outputs.digest }} |"
            echo "| lists-web | ${{ steps.version.outputs.version }} | ${{ steps.web.outputs.digest }} |"
          } >> "$GITHUB_STEP_SUMMARY"
